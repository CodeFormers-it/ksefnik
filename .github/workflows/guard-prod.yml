name: Guard prod branch

# Auto-close PRs targeting prod from non-org members.
# Only org members can open PRs to prod.

on:
  pull_request_target:
    branches: [prod]
    types: [opened]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check author association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
        # GitHub computes author_association on the event itself - no extra API call,
        # no auth-as-bot edge cases. OWNER/MEMBER/COLLABORATOR all imply trusted.
        # Anyone else (CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE) gets the PR closed.
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "$AUTHOR association=$ASSOCIATION - PR allowed"
              ;;
            *)
              gh pr close "$PR" \
                --repo "${{ github.repository }}" \
                --comment "PRs to \`prod\` are restricted to org members. Please open your PR against \`main\` instead."
              echo "Closed PR #$PR from $AUTHOR (association=$ASSOCIATION)"
              ;;
          esac
